<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Share via ShareT</title>
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 12px; margin: 0; }
    .card-info { background: #f4f5f7; border-radius: 6px; padding: 10px; margin-bottom: 12px; }
    .card-info h3 { margin: 0 0 4px; font-size: 14px; color: #172b4d; }
    .card-info p { margin: 0; font-size: 12px; color: #6b778c; }
    .btn-share { width: 100%; padding: 10px; background: #0079bf; color: white; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .btn-share:hover { background: #026aa7; }
    .success { color: #00875a; font-size: 13px; text-align: center; margin-top: 8px; display: none; }
    .success.show { display: block; }
  </style>
</head>
<body>
  <div class="card-info">
    <h3 id="cardName">Loading...</h3>
    <p id="boardName"></p>
  </div>
  
  <button class="btn-share" id="shareBtn">Open ShareT to Generate Link</button>
  <p class="success" id="successMsg">✓ Opening ShareT...</p>
  
  <script>
    var t = TrelloPowerUp.iframe();
    
    t.render(function() {
      var args = t.arg('args') || {};
      
      document.getElementById('cardName').textContent = args.cardName || 'Card';
      document.getElementById('boardName').textContent = args.boardName || 'Board';
      
      document.getElementById('shareBtn').addEventListener('click', function() {
        // Open ShareT portal with pre-filled data
        window.open(args.shareUrl, '_blank');
        
        // Show success indicator
        document.getElementById('successMsg').classList.add('show');
        
        // Persist link and increment count in Power-Up storage
        Promise.all([
          t.get('card', 'shared', 'shareCount'),
          t.get('card', 'shared', 'links')
        ]).then(function(results) {
          var count = (results[0] || 0) + 1;
          var links = results[1] || [];
          if (!links.includes(args.shareUrl)) links.unshift(args.shareUrl);
          return Promise.all([
            t.set('card', 'shared', 'shareCount', count),
            t.set('card', 'shared', 'links', links.slice(0, 10))
          ]);
        }).catch(function() {});
        
        // Close popup after delay
        setTimeout(function() {
          t.closePopup();
        }, 1500);
      });
    });
  </script>
</body>
</html>
