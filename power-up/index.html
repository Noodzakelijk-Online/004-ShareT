<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ShareT Power-Up</title>
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
  </style>
</head>
<body>
<script>
  // ShareT Power-Up - Native "Share" Button for Trello Cards
  // This Power-Up adds a "Share via ShareT" button to every Trello card.
  
  // Configure with your ShareT deployment URL
  const SHARET_BASE_URL = window.location.origin.replace(/\/power-up$/, '') || 'http://localhost:5005';
  
  TrelloPowerUp.initialize({
    // Card buttons — shown on card back
    'card-buttons': function(t, options) {
      return [{
        icon: 'https://cdn-icons-png.flaticon.com/512/2958/2958791.png',
        text: 'Share via ShareT',
        callback: function(t) {
          return t.card('id', 'name', 'url', 'idBoard')
            .then(function(card) {
              return t.board('id', 'name')
                .then(function(board) {
                  // Build the ShareT URL with pre-filled card data
                  const params = new URLSearchParams({
                    cardId: card.id,
                    cardName: card.name,
                    boardId: board.id,
                    boardName: board.name,
                    source: 'powerup'
                  });
                  
                  const shareUrl = `${SHARET_BASE_URL}/app?${params.toString()}`;
                  
                  return t.popup({
                    title: 'Share via ShareT',
                    url: './share-popup.html',
                    args: {
                      shareUrl: shareUrl,
                      cardName: card.name,
                      boardName: board.name,
                      cardId: card.id,
                      boardId: board.id,
                      sharetBaseUrl: SHARET_BASE_URL
                    },
                    height: 200
                  });
                });
            });
        }
      }];
    },
    
    // Card badges — show share status
    'card-badges': function(t, options) {
      return t.card('id').then(function(card) {
        // Check if card has been shared (stored in card plugin data)
        return t.get('card', 'shared', 'shareCount')
          .then(function(shareCount) {
            if (shareCount && shareCount > 0) {
              return [{
                text: `${shareCount} share${shareCount > 1 ? 's' : ''}`,
                color: 'green'
              }];
            }
            return [];
          })
          .catch(function() { return []; });
      });
    },
    
    // Card detail badges — shown on card back
    'card-detail-badges': function(t, options) {
      return t.get('card', 'shared', 'shareCount')
        .then(function(shareCount) {
          if (shareCount && shareCount > 0) {
            return [{
              title: 'ShareT Links',
              text: `${shareCount} active`,
              color: 'green',
              callback: function(t) {
                return t.popup({
                  title: 'ShareT Links',
                  url: './links-popup.html',
                  height: 300
                });
              }
            }];
          }
          return [];
        })
        .catch(function() { return []; });
    }
  });
</script>
</body>
</html>
