<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ShareT Links</title>
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 12px; margin: 0; }
    .link-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; background: #f4f5f7; border-radius: 4px; margin-bottom: 6px; }
    .link-url { font-size: 12px; color: #0079bf; text-decoration: none; word-break: break-all; flex: 1; margin-right: 8px; }
    .link-url:hover { text-decoration: underline; }
    .copy-btn { font-size: 11px; padding: 3px 8px; background: #0079bf; color: white; border: none; border-radius: 3px; cursor: pointer; white-space: nowrap; }
    .copy-btn:hover { background: #026aa7; }
    .empty { color: #6b778c; font-size: 13px; text-align: center; padding: 20px 0; }
    .header { font-size: 12px; color: #6b778c; margin-bottom: 8px; }
  </style>
</head>
<body>
  <p class="header">ShareT links for this card:</p>
  <div id="linksContainer"><p class="empty">No links yet. Use the Share button to create one.</p></div>
  <script>
    var t = TrelloPowerUp.iframe();

    t.render(function() {
      return t.get('card', 'shared', 'links').then(function(links) {
        var container = document.getElementById('linksContainer');
        if (!links || links.length === 0) return;
        container.innerHTML = '';
        links.forEach(function(url) {
          var item = document.createElement('div');
          item.className = 'link-item';
          var a = document.createElement('a');
          a.className = 'link-url';
          a.href = url;
          a.target = '_blank';
          a.textContent = url;
          var btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = 'Copy';
          btn.addEventListener('click', function() {
            navigator.clipboard.writeText(url).then(function() {
              btn.textContent = 'Copied!';
              setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
            });
          });
          item.appendChild(a);
          item.appendChild(btn);
          container.appendChild(item);
        });
      }).catch(function() {});
    });
  </script>
</body>
</html>
