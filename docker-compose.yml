services:
  sharet:
    build: .
    container_name: sharet-app
    restart: always
    env_file:
      - .env.docker
    ports:
      - "5005:5005"
    volumes:
      # Persist PouchDB data across container restarts
      - sharet-data:/app/backend/data
    environment:
      - NODE_ENV=production
      - PORT=5005
      - DATA_DIR=/app/backend/data
    # Resource limits (local-first optimization)
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1.5'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sharet-data:
    driver: local
