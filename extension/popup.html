<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ShareT Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; width: 300px; padding: 16px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 12px; color: #172b4d; }
    label { font-size: 13px; color: #5e6c84; display: block; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #dfe1e6; border-radius: 3px; font-size: 14px; }
    button { margin-top: 10px; width: 100%; padding: 8px; background: #0079bf; color: white; border: none; border-radius: 3px; font-size: 14px; cursor: pointer; }
    button:hover { background: #026aa7; }
    .saved { color: #00875a; font-size: 13px; text-align: center; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <h2>ShareT Configuration</h2>
  <label for="url">ShareT Server URL</label>
  <input type="url" id="url" placeholder="http://localhost:5005" />
  <button id="save">Save</button>
  <p class="saved" id="msg">✓ Saved!</p>
  
  <script>
    // Load saved URL
    chrome.storage.sync.get(['sharetUrl'], (result) => {
      document.getElementById('url').value = result.sharetUrl || '';
    });
    
    document.getElementById('save').addEventListener('click', () => {
      const url = document.getElementById('url').value.replace(/\/$/, '');
      chrome.storage.sync.set({ sharetUrl: url }, () => {
        const msg = document.getElementById('msg');
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 2000);
      });
    });
  </script>
</body>
</html>
